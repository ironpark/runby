name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      # The package's own subject, verified against the real thing: this job
      # runs on GitHub Actions, so the CLI must say so with exit code 0.
      - name: dogfood
        run: |
          go build -o runby-cli ./cmd/runby
          ./runby-cli is ci
          ./runby-cli is ci github-actions
          ./runby-cli is unattended
          ./runby-cli -v
